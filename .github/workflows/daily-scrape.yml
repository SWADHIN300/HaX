name: Daily Hackathon Scrape

on:
  schedule:
    # 8:00 AM IST = 2:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch: # Manual trigger via GitHub UI

env:
  NODE_ENV: production

jobs:
  scrape:
    name: Run HackAtlas Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: hackatlas-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: hackatlas-backend/node_modules
          key: ${{ runner.os }}-backend-deps-${{ hashFiles('hackatlas-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run pipeline
        id: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npx tsx src/runPipeline.ts 2>&1 | tee pipeline-output.log

      - name: Upload pipeline log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-log-${{ github.run_id }}
          path: hackatlas-backend/pipeline-output.log
          retention-days: 7
